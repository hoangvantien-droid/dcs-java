<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Nhóm chức năng — DCS</title></head>
<body>
<div layout:fragment="content">
<div class="page-header">
  <div class="page-header__titles">
    <h1>Nhóm chức năng</h1>
    <p class="page-header__desc">Nhóm người theo chức năng để cấp quyền xem tài liệu phạm vi group.</p>
  </div>
</div>
<div class="login-error" th:if="${error}" th:text="${error}">Lỗi</div>
<div class="danger-banner" th:if="${!stale.isEmpty()}">
  Có thành viên đã rời tổ chức hoặc đổi bộ phận — cần rà soát:
  <ul>
    <li th:each="s : ${stale}"><b th:text="${s.code}">mã</b> (<span th:text="${s.name}">tên</span>): thành viên <span th:text="${s.thanhVienCanRaSoat}"></span> — <span th:text="${s.lyDo}"></span></li>
  </ul>
</div>
<table class="data-table responsive-table">
  <thead><tr><th>Mã</th><th>Tên (công việc)</th><th>Người phụ trách</th><th>Thành viên</th></tr></thead>
  <tbody>
    <tr th:each="g : ${groups}">
      <td data-label="Mã"><b th:text="${g.code}">mã</b></td>
      <td data-label="Tên (công việc)" th:text="${g.name}">tên</td>
      <td data-label="Người phụ trách"
          th:text="${#lists.isEmpty(users.?[userId == g.ownerUserId])} ? ${g.ownerUserId} : ${users.^[userId == g.ownerUserId].fullName}">owner</td>
      <td data-label="Thành viên">
        <span class="chip" th:each="m : ${membersByGroup.get(g.groupId)}">
          <span th:text="${m.fullName} ?: ${m.email}">tên</span>
          <form method="post" th:action="@{/functional-groups/members/remove}" style="display:inline">
            <input type="hidden" name="group_id" th:value="${g.groupId}">
            <input type="hidden" name="user_id" th:value="${m.userId}">
            <button type="submit" class="chip-x">×</button>
          </form>
        </span>
        <form method="post" th:action="@{/functional-groups/members/add}" class="inline-form">
          <input type="hidden" name="group_id" th:value="${g.groupId}">
          <select name="user_id" required>
            <option value="">+ thêm thành viên</option>
            <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.fullName}">user</option>
          </select>
          <button type="submit">Thêm</button>
        </form>
      </td>
    </tr>
  </tbody>
</table>
<h2>Tạo nhóm chức năng</h2>
<form method="post" th:action="@{/functional-groups}" class="inline-form">
  <input name="code" placeholder="Mã (FG-CCP-HAP)" required>
  <input name="name" placeholder="Tên công việc" required>
  <select name="owner_user_id" required>
    <option value="">-- người phụ trách (bắt buộc) --</option>
    <option th:each="u : ${users}" th:value="${u.userId}" th:text="${u.fullName}">user</option>
  </select>
  <button type="submit">Tạo</button>
</form>
</div>
</body>
</html>
